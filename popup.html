<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Roblox Price Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1a1a1f;
      color: #e8e8e8;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      color: #00b2ff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 13px;
      color: #aaa;
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #00b2ff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover { background: #33c2ff; }
    .btn.secondary {
      background: #2a2a35;
      color: #ccc;
    }
    .btn.secondary:hover { background: #3a3a4a; }
    .status {
      font-size: 12px;
      color: #888;
      margin-top: 12px;
      text-align: center;
    }
    .links {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .links a {
      color: #00b2ff;
      font-size: 12px;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>📊 Roblox Price Tracker</h1>
  <p>
    Ouvre une page Limited sur le catalogue Roblox puis clique sur le bouton flottant 
    <strong>« Price History »</strong> pour voir l'historique des prix, RAP, Value et recommandations.
  </p>

  <button class="btn" id="refresh-cache">Rafraîchir cache Rolimon's</button>
  <a class="btn secondary" href="https://www.rolimons.com/deals" target="_blank">Voir les deals Rolimon's</a>
  <a class="btn secondary" href="https://www.roblox.com/catalog?Category=2&salesTypeFilter=2" target="_blank">Catalogue Limiteds</a>

  <div class="status" id="status"></div>

  <div class="links">
    <a href="https://www.rolimons.com" target="_blank">Rolimon's</a>
    <a href="https://www.youtube.com/results?search_query=roblox+limited+trading+deals+2026" target="_blank">YouTube Trading</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
